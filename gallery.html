<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="gallery.css">
  <!-- Visitor stats: GoatCounter (no cookies, no personal data) -- see privacy.html -->
  <script data-goatcounter="https://delight.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="no" title="Norsk" aria-label="Norsk">NO</button>
    <button type="button" data-lang="en" title="English" aria-label="English">EN</button>
    <button type="button" data-lang="de" title="Deutsch" aria-label="Deutsch">DE</button>
  </div>

  <div class="app">
    <header>
      <a class="back-link" id="back-link" href="index.html">&larr; Welcome</a>
      <h1 id="gallery-heading">Gallery</h1>
    </header>
    <div class="toolbar">
      <div class="toolbar-row">
        <input type="search" id="search-input" placeholder="Search photos…" autocomplete="off" spellcheck="false">
        <select id="folder-filter">
          <option value="" id="folder-default-option">All folders</option>
        </select>
        <button type="button" class="clear-filters" id="clear-filters" hidden>Clear filters</button>
      </div>
      <div class="tag-filter" id="tag-filter"></div>
    </div>
    <main>
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">No images to show.</div>
    </main>
    <footer class="site-footer">
      <div class="footer-links">
        <span><span id="contact-label">Contact</span>: <a data-email="catsdelight.net|delight"></a></span>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <a href="https://stock.adobe.com/contributor/213696925/Delight" target="_blank" rel="noopener" id="stock-footer-link">Our photos on Adobe Stock</a>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <a href="privacy.html" id="privacy-link">Privacy &amp; cookies</a>
      </div>
      <div class="footer-credit">
        <span id="credit-label">Website by</span> <a href="https://tirco.tv" target="_blank" rel="noopener">Tirco</a>
        <span class="footer-sep" aria-hidden="true">&middot;</span>
        <a data-email="tirco.tv|tirco"></a>
      </div>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-body">
      <div class="stage" id="stage">
        <button class="nav-btn prev" id="prev-btn" aria-label="Previous">&#8249;</button>
        <img id="stage-img" alt="">
        <button class="nav-btn next" id="next-btn" aria-label="Next">&#8250;</button>
        <button class="close-btn" id="close-btn" aria-label="Close">&times;</button>
        <button class="info-toggle" id="info-toggle" aria-label="Toggle info panel" aria-expanded="true">i</button>
        <button class="share-btn" id="share-btn" aria-label="Share">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
          </svg>
        </button>
        <button class="zoom-btn" id="zoom-btn" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/>
            <line x1="7.5" y1="10.5" x2="13.5" y2="10.5"/><line class="zoom-plus" x1="10.5" y1="7.5" x2="10.5" y2="13.5"/>
          </svg>
        </button>
        <button class="paw-btn" id="paw-btn" aria-pressed="false">
          <span class="paw-icon" aria-hidden="true"></span>
          <span class="paw-count" id="paw-count"></span>
        </button>
        <div class="paw-hint" id="paw-hint" aria-hidden="true"></div>
        <div class="share-menu" id="share-menu" role="menu" hidden></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
      <aside class="panel" id="panel">
        <h2 id="panel-title"></h2>
        <div class="photographer" id="panel-photographer"></div>
        <div class="description" id="panel-description"></div>

        <div class="tags" id="panel-tags"></div>

        <a class="stock-note" href="https://stock.adobe.com/contributor/213696925/Delight" target="_blank" rel="noopener">
          <span id="stock-note-text">Want to use this photo? Find our photos on Adobe Stock</span> <span aria-hidden="true">&rarr;</span>
        </a>

        <div class="meta-block" id="location-block" style="display:none;">
          <h3 id="location-heading">Location</h3>
          <div id="panel-location"></div>
        </div>

        <div class="meta-block">
          <h3 id="camera-heading">Camera</h3>
          <div id="panel-camera"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const LANG_KEY = "delightfulcat-lang";
      const SUPPORTED = ["no", "en", "de"];

      const STRINGS = {
        en: {
          pageTitle: "Gallery",
          back: "Welcome",

          allFolders: "All folders",

          clearFilters: "Clear filters",
          moreTags: "+ {n} more",
          fewerTags: "Fewer tags",

          emptyState: "No images to show.",
          loadError: "Could not load image_info.json: ",
          prev: "Previous",
          next: "Next",

          toggleInfo: "Toggle info panel",
          untitled: "(untitled)",

          stockNote: "Want to use this photo? Find our photos on Adobe Stock",

        },
        no: {
          pageTitle: "Galleri",
          back: "Velkommen",
          heading: "Galleri",
          allFolders: "Alle mapper",
          search: "Søk i bildene …",
          clearFilters: "Nullstill filtre",
          moreTags: "+ {n} til",
          fewerTags: "Færre stikkord",
          filterByTag: "Vis bilder merket «{tag}»",
          noMatches: "Ingen bilder passer med filtrene.",
          emptyState: "Ingen bilder å vise.",
          loadError: "Kunne ikke laste image_info.json: ",

          toggleInfo: "Vis eller skjul infopanelet",
          untitled: "(uten tittel)",
          by: "av",
          location: "Sted",
          camera: "Kamera",
          viewMap: "vis kart",
          share: "Del",
          zoomIn: "Zoom inn (eller rull / dobbeltklikk på bildet)",
          zoomOut: "Zoom ut",
          linkCopied: "Lenke kopiert!",
          copyPrompt: "Kopier denne lenken:",
          shareTitle: "Del dette bildet",
          copyLink: "Kopier lenke",
          email: "E-post",
          moreOptions: "Mer …",
          emailBody: "Et bilde fra Cat's Delight:",
          givePaw: "Gi bildet en pote",
          pawed: "Du ga bildet en pote",
          pawHint: "Liker du bildet? Gi det en pote!",
          privacy: "Personvern og informasjonskapsler",
          stockNote: "Vil du bruke bildet? Finn bildene våre på Adobe Stock",
          stockFooter: "Bildene våre på Adobe Stock",
          contact: "Kontakt",
          credit: "Nettside laget av",
          labels: { camera: "Kamera", lens: "Objektiv", focal: "Brennvidde", aperture: "Blender", shutter: "Lukkertid", iso: "ISO", taken: "Tatt", dimensions: "Dimensjoner" }
        },
        de: {
          pageTitle: "Galerie",
          back: "Willkommen",
          heading: "Galerie",
          allFolders: "Alle Ordner",
          search: "Fotos durchsuchen …",
          clearFilters: "Filter zurücksetzen",
          moreTags: "+ {n} weitere",
          fewerTags: "Weniger Schlagwörter",
          filterByTag: "Fotos mit „{tag}“ anzeigen",
          noMatches: "Keine Fotos passen zu diesen Filtern.",
          emptyState: "Keine Bilder vorhanden.",
          loadError: "image_info.json konnte nicht geladen werden: ",
          prev: "Zurück",
          next: "Weiter",
          close: "Schließen",
          toggleInfo: "Infopanel ein- oder ausblenden",
          untitled: "(ohne Titel)",
          by: "von",
          location: "Ort",
          camera: "Kamera",
          viewMap: "Karte ansehen",
          share: "Teilen",
          zoomIn: "Vergrößern (oder scrollen / Foto doppelklicken)",
          zoomOut: "Verkleinern",
          linkCopied: "Link kopiert!",
          copyPrompt: "Diesen Link kopieren:",
          shareTitle: "Dieses Foto teilen",
          copyLink: "Link kopieren",
          email: "E-Mail",
          moreOptions: "Mehr …",
          emailBody: "Ein Foto von Cat's Delight:",
          givePaw: "Diesem Foto eine Pfote geben",
          pawed: "Du hast diesem Foto eine Pfote gegeben",
          pawHint: "Gefällt dir das Foto? Gib ihm eine Pfote!",
          privacy: "Datenschutz & Cookies",
          stockNote: "Möchtest du dieses Foto verwenden? Unsere Fotos gibt es bei Adobe Stock",
          stockFooter: "Unsere Fotos bei Adobe Stock",
          contact: "Kontakt",
          credit: "Website von",
          labels: { camera: "Kamera", lens: "Objektiv", focal: "Brennweite", aperture: "Blende", shutter: "Verschlusszeit", iso: "ISO", taken: "Aufgenommen", dimensions: "Abmessungen" }
        }
      };

      let lang = "en";
      let images = [];
      let filtered = [];
      let lightboxIndex = 0;
      let loadFailed = false;
      let lastErrorMessage = "";
      const PANEL_KEY = "gallery-panel-collapsed";

      const grid = document.getElementById("grid");
      const emptyState = document.getElementById("empty-state");
      const folderFilter = document.getElementById("folder-filter");
      const searchInput = document.getElementById("search-input");
      const tagFilterEl = document.getElementById("tag-filter");
      const clearFiltersBtn = document.getElementById("clear-filters");
      const activeTags = new Set(); // lower-cased English tags, combined with AND
      let tagsExpanded = false;
      const TAG_LIMIT = 12;
      const switchEl = document.getElementById("lang-switch");

      const lightbox = document.getElementById("lightbox");
      const lightboxBackdrop = document.getElementById("lightbox-backdrop");
      const stageImg = document.getElementById("stage-img");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const closeBtn = document.getElementById("close-btn");
      const infoToggle = document.getElementById("info-toggle");
      const shareBtn = document.getElementById("share-btn");
      const toast = document.getElementById("toast");
      const pawBtn = document.getElementById("paw-btn");
      const pawCountEl = document.getElementById("paw-count");

      function t() {
        return STRINGS[lang] || STRINGS.en;
      }

      // Email addresses are assembled here instead of written in the HTML,
      // to keep simple spam scrapers off them. data-email="domain|user".
      document.querySelectorAll("a[data-email]").forEach((a) => {
        const address = a.dataset.email.split("|").reverse().join("@");
        a.href = `mailto:${address}`;
        a.textContent = address;
      });

      function detectLang() {
        const saved = localStorage.getItem(LANG_KEY);
        if (saved && SUPPORTED.includes(saved)) return saved;
        const nav = (navigator.language || "en").toLowerCase();
        if (nav.startsWith("nb") || nav.startsWith("nn") || nav.startsWith("no")) return "no";
        if (nav.startsWith("de")) return "de";
        return "en";
      }

      function applyStaticStrings() {
        const s = t();
        document.documentElement.lang = lang;
        document.getElementById("back-link").textContent = "← " + s.back;
        document.getElementById("gallery-heading").textContent = s.heading;
        document.getElementById("folder-default-option").textContent = s.allFolders;
        searchInput.placeholder = s.search;
        searchInput.setAttribute("aria-label", s.search);
        clearFiltersBtn.textContent = s.clearFilters;
        if (loadFailed) {
          emptyState.textContent = s.loadError + lastErrorMessage;
        } else if (!filtered.length && !images.length) {
          emptyState.textContent = s.emptyState;
        }
        prevBtn.setAttribute("aria-label", s.prev);
        nextBtn.setAttribute("aria-label", s.next);
        closeBtn.setAttribute("aria-label", s.close);
        infoToggle.setAttribute("aria-label", s.toggleInfo);
        shareBtn.setAttribute("aria-label", s.share);
        shareBtn.title = s.share;
        renderZoomBtn();
        document.getElementById("privacy-link").textContent = s.privacy;
        document.getElementById("stock-note-text").textContent = s.stockNote;
        document.getElementById("stock-footer-link").textContent = s.stockFooter;
        document.getElementById("contact-label").textContent = s.contact;
        document.getElementById("credit-label").textContent = s.credit;
        if (filtered[lightboxIndex]) renderPaw(filtered[lightboxIndex]);
        document.getElementById("location-heading").textContent = s.location;
        document.getElementById("camera-heading").textContent = s.camera;
        document.title = lightbox.classList.contains("open") ? document.title : s.pageTitle;

        switchEl.querySelectorAll("button").forEach((btn) => {
          btn.setAttribute("aria-current", btn.dataset.lang === lang ? "true" : "false");
        });
      }

      function setLang(next) {
        lang = next;
        localStorage.setItem(LANG_KEY, lang);
        applyStaticStrings();
        // Search also matches the current language's translations, so re-filter.
        if (images.length) applyFilter();
        if (lightbox.classList.contains("open")) renderStage(0);
      }

      switchEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-lang]");
        if (!btn) return;
        setLang(btn.dataset.lang);
      });

      window.addEventListener("hashchange", () => {
        const id = photoIdFromHash();
        if (id && images.length) openPhotoById(id);
      });

      function metaRow(label, value) {
        if (value === null || value === undefined || value === "") return "";
        return `<div class="meta-row"><span>${label}</span><span>${value}</span></div>`;
      }

      function thumbSrc(img) {
        return img.thumbnail || img.filename;
      }

      // Title/description/tags are written in English; the prepper adds
      // auto-translations under img.i18n[lang]. Fall back to the original.
      function localized(img, field) {
        const tr = img.i18n && img.i18n[lang];
        const value = tr && tr[field];
        if (Array.isArray(value) ? value.length : value) return value;
        return img[field];
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function renderGrid() {
        grid.innerHTML = "";
        emptyState.style.display = filtered.length ? "none" : "";
        emptyState.textContent = images.length ? t().noMatches : t().emptyState;
        filtered.forEach((img, i) => {
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "thumb";
          const title = localized(img, "title");
          cell.innerHTML = `
            <img src="${thumbSrc(img)}" alt="${escapeHtml(title || "")}" loading="lazy">
            ${title ? `<span class="thumb-title">${escapeHtml(title)}</span>` : ""}
          `;
          cell.addEventListener("click", () => openLightbox(i));
          grid.appendChild(cell);
        });
      }

      // Slide/fade between photos: the old one slides out while the new one
      // preloads, then the new one slides in from the side you're heading to.
      let swapToken = 0;
      function swapStageImage(src, direction) {
        const token = ++swapToken;
        if (!direction || !stageImg.getAttribute("src")) {
          stageImg.src = src;
          return;
        }
        const outCls = direction > 0 ? "out-left" : "out-right";
        const inCls = direction > 0 ? "out-right" : "out-left";
        const loaded = new Promise((resolve) => {
          const pre = new Image();
          pre.onload = pre.onerror = resolve;
          pre.src = src;
        });
        const fadedOut = new Promise((resolve) => setTimeout(resolve, 220));
        stageImg.classList.remove("out-left", "out-right");
        stageImg.classList.add(outCls);
        Promise.all([loaded, fadedOut]).then(() => {
          if (token !== swapToken) return; // user already moved on
          stageImg.classList.add("no-anim");
          stageImg.classList.remove("out-left", "out-right");
          stageImg.classList.add(inCls);
          stageImg.src = src;
          void stageImg.offsetWidth; // commit the start position before animating in
          stageImg.classList.remove("no-anim", inCls);
        });
      }

      function preloadNeighbours() {
        [-1, 1].forEach((d) => {
          const n = filtered[(lightboxIndex + d + filtered.length) % filtered.length];
          if (n) new Image().src = n.filename;
        });
      }

      function renderStage(direction) {
        const img = filtered[lightboxIndex];
        if (!img) return;
        const s = t();

        const title = localized(img, "title");
        resetZoom();
        swapStageImage(img.filename, direction);
        setPhotoHash(img.id);
        loadPaws(img);
        stageImg.alt = title || "";
        document.title = title ? `${title} · ${s.pageTitle}` : s.pageTitle;

        document.getElementById("panel-title").textContent = title || s.untitled;
        document.getElementById("panel-photographer").textContent = img.photographer ? `${s.by} ${img.photographer}` : "";
        document.getElementById("panel-description").textContent = localized(img, "description") || "";

        document.getElementById("panel-tags").innerHTML = imageTags(img)
          .map(({ key, label }) => `<button type="button" class="tag" data-tag="${escapeHtml(key)}"
            title="${escapeHtml(s.filterByTag.replace("{tag}", label))}">${escapeHtml(label)}</button>`).join("");

        const locationBlock = document.getElementById("location-block");
        if (img.location && img.location.name) {
          let html = img.location.name;
          if (img.location.lat != null && img.location.lng != null) {
            const url = `https://www.openstreetmap.org/?mlat=${img.location.lat}&mlon=${img.location.lng}#map=12/${img.location.lat}/${img.location.lng}`;
            html += ` &middot; <a class="map-link" href="${url}" target="_blank" rel="noopener">${s.viewMap}</a>`;
          }
          document.getElementById("panel-location").innerHTML = html;
          locationBlock.style.display = "";
        } else {
          locationBlock.style.display = "none";
        }

        const cam = img.camera || {};
        const cameraLabel = cam.model && cam.make && !cam.model.toLowerCase().startsWith(cam.make.toLowerCase())
          ? `${cam.make} ${cam.model}`
          : (cam.model || cam.make || "");
        document.getElementById("panel-camera").innerHTML = [
          metaRow(s.labels.camera, cameraLabel),
          metaRow(s.labels.lens, cam.lens_model),
          metaRow(s.labels.focal, cam.focal_length),
          metaRow(s.labels.aperture, cam.aperture),
          metaRow(s.labels.shutter, cam.shutter_speed),
          metaRow(s.labels.iso, cam.iso),
          metaRow(s.labels.taken, cam.date_taken),
          metaRow(s.labels.dimensions, img.width && img.height ? `${img.width}×${img.height}` : ""),
        ].join("");
        preloadNeighbours();
      }

      // ---- Shareable links: gallery.html#photo=<id> opens that photo ----
      function photoIdFromHash() {
        const m = location.hash.match(/^#photo=(.+)$/);
        return m ? decodeURIComponent(m[1]) : null;
      }

      function setPhotoHash(id) {
        const url = id ? `#photo=${encodeURIComponent(id)}` : location.pathname + location.search;
        if ((id && location.hash !== url) || (!id && location.hash)) history.replaceState(null, "", url);
      }

      function openPhotoById(id) {
        let i = filtered.findIndex((img) => img.id === id);
        if (i < 0 && images.some((img) => img.id === id)) {
          resetFilters(); // it's filtered out -- show all
          applyFilter();
          i = filtered.findIndex((img) => img.id === id);
        }
        if (i >= 0) openLightbox(i);
      }

      let toastTimer;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
      }

      // ---- Share menu ----
      // Links point at share/<id>.html (written by the prepper on export):
      // social sites build their preview card from that page's tags, then it
      // forwards visitors to gallery.html#photo=<id>.
      const shareMenu = document.getElementById("share-menu");
      const enc = encodeURIComponent;
      const LINK_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
      const SHARE_TARGETS = [
        { id: "copy", badge: LINK_SVG, color: "#4a4436" },
        { id: "whatsapp", label: "WhatsApp", badge: "✆", color: "#25d366",
          href: (u, title) => `https://wa.me/?text=${enc(`${title} ${u}`)}` },
        { id: "facebook", label: "Facebook", badge: "f", color: "#1877f2",
          href: (u) => `https://www.facebook.com/sharer/sharer.php?u=${enc(u)}` },
        { id: "x", label: "X", badge: "𝕏", color: "#000000",
          href: (u, title) => `https://twitter.com/intent/tweet?url=${enc(u)}&text=${enc(title)}` },
        { id: "bluesky", label: "Bluesky", badge: "🦋", color: "#1185fe",
          href: (u, title) => `https://bsky.app/intent/compose?text=${enc(`${title} ${u}`)}` },
        { id: "pinterest", label: "Pinterest", badge: "P", color: "#e60023",
          href: (u, title, image) => `https://www.pinterest.com/pin/create/button/?url=${enc(u)}&media=${enc(image)}&description=${enc(title)}` },
        { id: "reddit", label: "Reddit", badge: "r", color: "#ff4500",
          href: (u, title) => `https://www.reddit.com/submit?url=${enc(u)}&title=${enc(title)}` },
        { id: "telegram", label: "Telegram", badge: "➤", color: "#229ed9",
          href: (u, title) => `https://t.me/share/url?url=${enc(u)}&text=${enc(title)}` },
        { id: "email", badge: "✉", color: "#7a6a4a", mail: true,
          href: (u, title) => `mailto:?subject=${enc(title)}&body=${enc(`${t().emailBody}\n${u}`)}` },
        { id: "native", badge: "⋯", color: "#4a4436", nativeOnly: true },
      ];

      function shareInfo() {
        const img = filtered[lightboxIndex];
        return {
          url: new URL(`share/${enc(img.id)}.html`, location.href).href,
          title: localized(img, "title") || t().pageTitle,
          // ~1200px JPEG made alongside each photo on export (Pinterest needs an image URL)
          image: new URL(img.filename.replace(/\.[^.]+$/, "_share.jpg"), location.href).href,
        };
      }

      function countShare(target) {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: `share/${target}`, title: `Share: ${target}`, event: true });
        }
      }

      async function copyLink(url) {
        try {
          await navigator.clipboard.writeText(url);
          showToast(t().linkCopied);
        } catch (err) {
          window.prompt(t().copyPrompt, url);
        }
      }

      function closeShareMenu() {
        shareMenu.hidden = true;
        shareBtn.setAttribute("aria-expanded", "false");
      }

      function openShareMenu() {
        const s = t();
        shareMenu.innerHTML = "";
        const heading = document.createElement("div");
        heading.className = "share-menu-title";
        heading.textContent = s.shareTitle;
        shareMenu.appendChild(heading);
        SHARE_TARGETS.forEach((target) => {
          if (target.nativeOnly && !navigator.share) return;
          const item = document.createElement("button");
          item.type = "button";
          item.className = "share-item";
          item.setAttribute("role", "menuitem");
          const badge = document.createElement("span");
          badge.className = "share-badge";
          badge.style.background = target.color;
          badge.innerHTML = target.badge;
          const label = document.createElement("span");
          label.textContent = target.label || { copy: s.copyLink, email: s.email, native: s.moreOptions }[target.id];
          item.append(badge, label);
          item.addEventListener("click", async () => {
            const { url, title, image } = shareInfo();
            closeShareMenu();
            countShare(target.id);
            if (target.id === "copy") return copyLink(url);
            if (target.id === "native") {
              try { await navigator.share({ title, url }); } catch (err) { /* cancelled */ }
              return;
            }
            const href = target.href(url, title, image);
            if (target.mail) location.href = href;
            else window.open(href, "_blank", "noopener,width=680,height=640");
          });
          shareMenu.appendChild(item);
        });
        shareMenu.hidden = false;
        shareBtn.setAttribute("aria-expanded", "true");
        const first = shareMenu.querySelector(".share-item");
        if (first) first.focus({ preventScroll: true });
      }

      shareBtn.setAttribute("aria-haspopup", "menu");
      shareBtn.setAttribute("aria-expanded", "false");
      shareBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (shareMenu.hidden) openShareMenu();
        else closeShareMenu();
      });
      document.addEventListener("click", (e) => {
        if (!shareMenu.hidden && !shareMenu.contains(e.target)) closeShareMenu();
      });
      // The menu sits inside the stage -- don't let scrolling it count as a photo swipe.
      ["touchstart", "touchend"].forEach((type) => {
        shareMenu.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
      });

      // ---- Paws (likes) ----
      // GitHub Pages has no backend, so counts live in Abacus, a free keyless
      // counter API (namespace/key -> number). This browser remembers which
      // photos it already pawed, allowing one paw per photo per browser.
      const PAW_API = "https://abacus.jasoncameron.dev";
      const PAW_NAMESPACE = "catsdelight";
      const PAWED_KEY = "gallery-pawed";
      const pawCounts = {}; // photo id -> count (fetched lazily per photo)
      let pawed = new Set();
      try { pawed = new Set(JSON.parse(localStorage.getItem(PAWED_KEY) || "[]")); } catch (err) { /* ignore */ }

      function pawUrl(action, id) {
        return `${PAW_API}/${action}/${PAW_NAMESPACE}/paw-${id}`;
      }

      function renderPaw(img) {
        const has = pawed.has(img.id);
        pawBtn.classList.toggle("pawed", has);
        pawBtn.setAttribute("aria-pressed", String(has));
        const label = has ? t().pawed : t().givePaw;
        pawBtn.title = label;
        pawBtn.setAttribute("aria-label", label);
        pawCountEl.textContent = img.id in pawCounts ? String(pawCounts[img.id]) : "";
      }

      async function loadPaws(img) {
        renderPaw(img);
        if (img.id in pawCounts) return;
        try {
          const res = await fetch(pawUrl("get", img.id));
          pawCounts[img.id] = res.status === 404 ? 0 : ((await res.json()).value || 0);
        } catch (err) {
          return; // counter service unreachable -- the button still works locally
        }
        if (filtered[lightboxIndex] === img) renderPaw(img);
      }

      function restartAnimation(el, cls) {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
      }

      // Drawn paw instead of the 🐾 emoji, which every platform colours
      // differently (purple on Windows) -- this one is gold everywhere.
      const PAW_SVG = '<svg viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true"><g fill="currentColor">' +
        '<path d="M32 33c-9 0-17 8.5-17 15.5 0 5 4 7.5 8.5 7.5 3.5 0 5.5-1.8 8.5-1.8s5 1.8 8.5 1.8c4.5 0 8.5-2.5 8.5-7.5C49 41.5 41 33 32 33z"/>' +
        '<ellipse cx="13" cy="30" rx="6" ry="7.5" transform="rotate(-25 13 30)"/>' +
        '<ellipse cx="24" cy="17" rx="6" ry="8.5" transform="rotate(-10 24 17)"/>' +
        '<ellipse cx="40" cy="17" rx="6" ry="8.5" transform="rotate(10 40 17)"/>' +
        '<ellipse cx="51" cy="30" rx="6" ry="7.5" transform="rotate(25 51 30)"/></g></svg>';
      pawBtn.querySelector(".paw-icon").innerHTML = PAW_SVG;

      function spawn(parent, cls, symbol, x, y, vars) {
        const el = document.createElement("span");
        el.className = cls;
        if (symbol === "paw") el.innerHTML = PAW_SVG;
        else el.textContent = symbol;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        Object.entries(vars || {}).forEach(([k, v]) => el.style.setProperty(k, v));
        el.addEventListener("animationend", () => el.remove());
        parent.appendChild(el);
      }

      // The fun part: a paw stamped onto the photo, a burst of little paws and
      // sparkles out of the button, a ring pulse and a bouncing count.
      function celebratePaw() {
        const stageEl = document.getElementById("stage");
        const stageRect = stageEl.getBoundingClientRect();
        const btnRect = pawBtn.getBoundingClientRect();
        spawn(stageEl, "paw-stamp", "paw", stageRect.width / 2, stageRect.height / 2);

        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const cx = btnRect.left + btnRect.width / 2 - stageRect.left;
        const cy = btnRect.top + btnRect.height / 2 - stageRect.top;
        const symbols = ["paw", "paw", "✨", "paw", "💛"];
        for (let i = 0; i < (reduced ? 0 : 14); i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2; // mostly upwards
          const dist = 70 + Math.random() * 110;
          spawn(stageEl, "paw-particle", symbols[i % symbols.length], cx, cy, {
            "--dx": `${Math.cos(angle) * dist}px`,
            "--dy": `${Math.sin(angle) * dist}px`,
            "--rot": `${Math.random() * 90 - 45}deg`,
            "--delay": `${Math.random() * 90}ms`,
            "--size": `${13 + Math.random() * 13}px`,
          });
        }
        restartAnimation(pawBtn, "celebrate");
        restartAnimation(pawCountEl, "bump");
        if (navigator.vibrate) navigator.vibrate(18);
      }

      // "Like this photo? Give it a paw!" -- only until the visitor has given
      // their first paw, and only for the first few photos they open.
      const PAW_HINT_KEY = "gallery-paw-hint-shown";
      const PAW_HINT_MAX = 5;
      const pawHint = document.getElementById("paw-hint");
      let pawHintTimer;

      function hidePawHint() {
        clearTimeout(pawHintTimer);
        pawHint.classList.remove("show");
      }

      function maybeShowPawHint() {
        hidePawHint();
        if (pawed.size) return;
        let shown = 0;
        try { shown = parseInt(localStorage.getItem(PAW_HINT_KEY) || "0", 10) || 0; } catch (err) { /* ignore */ }
        if (shown >= PAW_HINT_MAX) return;
        try { localStorage.setItem(PAW_HINT_KEY, String(shown + 1)); } catch (err) { /* ignore */ }
        pawHint.textContent = t().pawHint;
        pawHintTimer = setTimeout(() => {
          pawHint.classList.add("show");
          pawHintTimer = setTimeout(hidePawHint, 4000);
        }, 900);
      }

      pawBtn.addEventListener("click", async () => {
        const img = filtered[lightboxIndex];
        if (!img) return;
        hidePawHint();
        restartAnimation(pawBtn, "pop");
        if (pawed.has(img.id)) return;
        celebratePaw();
        pawed.add(img.id);
        try { localStorage.setItem(PAWED_KEY, JSON.stringify([...pawed])); } catch (err) { /* ignore */ }
        pawCounts[img.id] = (pawCounts[img.id] || 0) + 1; // optimistic
        renderPaw(img);
        try {
          const res = await fetch(pawUrl("hit", img.id));
          const value = (await res.json()).value;
          if (typeof value === "number") pawCounts[img.id] = value;
        } catch (err) {
          return;
        }
        if (filtered[lightboxIndex] === img) renderPaw(img);
      });

      // Photo views show up in GoatCounter as "photo/<id>" events.
      function countPhotoView(img) {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: `photo/${img.id}`, title: img.title || img.id, event: true });
        }
      }

      function openLightbox(i) {
        lightboxIndex = i;
        renderStage(0);
        countPhotoView(filtered[i]);
        maybeShowPawHint();
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.classList.add("lightbox-open");
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.classList.remove("lightbox-open");
        document.title = t().pageTitle;
        setPhotoHash(null);
        hidePawHint();
        closeShareMenu();
        resetZoom();
      }

      function show(delta) {
        if (!filtered.length) return;
        lightboxIndex = (lightboxIndex + delta + filtered.length) % filtered.length;
        closeShareMenu();
        renderStage(delta);
        countPhotoView(filtered[lightboxIndex]);
        maybeShowPawHint();
      }

      // Basic deterrent against casual right-click / long-press "Save image".
      // Not real protection (anything shown in a browser can be saved) --
      // the watermark is what actually travels with the photo.
      document.addEventListener("contextmenu", (e) => {
        if (e.target.closest(".thumb, .stage")) e.preventDefault();
      });
      document.addEventListener("dragstart", (e) => {
        if (e.target.tagName === "IMG") e.preventDefault();
      });

      function setPanelCollapsed(collapsed) {
        resetZoom(); // the photo's fitted size changes with the panel
        lightbox.classList.toggle("panel-collapsed", collapsed);
        infoToggle.setAttribute("aria-expanded", String(!collapsed));
        localStorage.setItem(PANEL_KEY, collapsed ? "1" : "0");
      }

      prevBtn.addEventListener("click", () => show(-1));
      nextBtn.addEventListener("click", () => show(1));
      closeBtn.addEventListener("click", closeLightbox);
      lightboxBackdrop.addEventListener("click", closeLightbox);
      infoToggle.addEventListener("click", () => {
        setPanelCollapsed(!lightbox.classList.contains("panel-collapsed"));
      });

      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (!shareMenu.hidden) {
          if (e.key === "Escape") {
            closeShareMenu();
            shareBtn.focus();
          }
          return;
        }
        const { cx, cy } = stageBox();
        if (e.key === "ArrowLeft") show(-1);
        if (e.key === "ArrowRight") show(1);
        if (e.key === "+" || e.key === "=") zoomTo(zoom.s * 1.5, cx, cy);
        if (e.key === "-") zoomTo(zoom.s / 1.5, cx, cy);
        if (e.key === "0") resetZoom();
        if (e.key === "Escape") {
          if (isZoomed()) resetZoom(); // first Escape zooms out, the next one closes
          else closeLightbox();
        }
      });

      // Touch swipe navigation inside the lightbox.
      let touchStartX = null;
      const stage = document.getElementById("stage");
      stage.addEventListener("touchstart", (e) => {
        // a second finger means pinch-zoom, and a zoomed photo pans instead
        touchStartX = e.touches.length === 1 && !isZoomed() ? e.changedTouches[0].clientX : null;
      }, { passive: true });
      stage.addEventListener("touchend", (e) => {
        if (touchStartX === null || isZoomed()) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(dx) < 40) return;
        show(dx > 0 ? -1 : 1);
      }, { passive: true });

      // ---- Zoom: wheel, double-click/-tap, pinch, the zoom button; drag to pan ----
      // The lightbox already shows the full-resolution file, so zooming reveals
      // real detail. The image is flex-centred in the stage, so it's scaled
      // around the stage's centre and shifted by (x, y), clamped to its edges.
      const zoomBtn = document.getElementById("zoom-btn");
      const zoom = { s: 1, x: 0, y: 0 };
      const pointers = new Map(); // pointerId -> { x, y, sx, sy, t }
      let pinch = null; // zoom state + finger distance/midpoint when a pinch starts
      let pan = null;   // zoom offset + pointer position when a drag starts
      let lastTap = null;
      let lastTouchToggle = 0;

      function isZoomed() {
        return zoom.s > 1.01;
      }

      function nativeScale() {
        return stageImg.naturalWidth / (stageImg.offsetWidth || 1);
      }

      function maxZoom() {
        return Math.max(3, nativeScale() * 1.5);
      }

      function stageBox() {
        const r = stage.getBoundingClientRect();
        return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: r.width, h: r.height };
      }

      function renderZoomBtn() {
        const zoomed = isZoomed();
        const label = zoomed ? t().zoomOut : t().zoomIn;
        zoomBtn.setAttribute("aria-pressed", String(zoomed));
        zoomBtn.setAttribute("aria-label", label);
        zoomBtn.title = label;
      }

      function applyZoom() {
        const { w, h } = stageBox();
        const limX = Math.max(0, (stageImg.offsetWidth * zoom.s - w) / 2);
        const limY = Math.max(0, (stageImg.offsetHeight * zoom.s - h) / 2);
        zoom.x = Math.min(limX, Math.max(-limX, zoom.x));
        zoom.y = Math.min(limY, Math.max(-limY, zoom.y));
        stageImg.style.transform = isZoomed() ? `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})` : "";
        stage.classList.toggle("zoomed", isZoomed());
        renderZoomBtn();
      }

      // Zoom to scale s, keeping the photo point under (px, py) where it is.
      function zoomTo(s, px, py) {
        const { cx, cy } = stageBox();
        s = Math.min(maxZoom(), Math.max(1, s));
        const k = s / zoom.s;
        zoom.x = px - cx - k * (px - cx - zoom.x);
        zoom.y = py - cy - k * (py - cy - zoom.y);
        zoom.s = s;
        if (!isZoomed()) Object.assign(zoom, { s: 1, x: 0, y: 0 });
        applyZoom();
      }

      // Double-click/-tap and the button jump to 100% pixels (at least 2.5x).
      function toggleZoom(px, py) {
        if (isZoomed()) zoomTo(1, px, py);
        else zoomTo(Math.min(maxZoom(), Math.max(2.5, nativeScale())), px, py);
      }

      function resetZoom() {
        Object.assign(zoom, { s: 1, x: 0, y: 0 });
        pointers.clear();
        pinch = pan = null;
        stage.classList.remove("zoomed", "gesturing");
        stageImg.style.transform = "";
        renderZoomBtn();
      }

      function startGesture() {
        const pts = [...pointers.values()];
        pinch = pan = null;
        if (pts.length >= 2) {
          const [a, b] = pts;
          pinch = { ...zoom, dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
        } else if (pts.length === 1 && isZoomed()) {
          pan = { x: zoom.x, y: zoom.y, px: pts[0].x, py: pts[0].y };
        }
        stage.classList.toggle("gesturing", Boolean(pinch || pan));
      }

      zoomBtn.addEventListener("click", () => {
        const { cx, cy } = stageBox();
        toggleZoom(cx, cy);
      });

      stage.addEventListener("wheel", (e) => {
        if (!stageImg.naturalWidth || e.target.closest(".share-menu")) return;
        e.preventDefault();
        const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY; // lines -> pixels
        zoomTo(zoom.s * Math.exp(-dy * 0.002), e.clientX, e.clientY);
      }, { passive: false });

      stageImg.addEventListener("dblclick", (e) => {
        if (Date.now() - lastTouchToggle < 600) return; // already handled as a double-tap
        toggleZoom(e.clientX, e.clientY);
      });

      stageImg.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        stageImg.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: Date.now() });
        startGesture();
      });

      stageImg.addEventListener("pointermove", (e) => {
        const p = pointers.get(e.pointerId);
        if (!p) return;
        p.x = e.clientX;
        p.y = e.clientY;
        if (pinch && pointers.size >= 2) {
          const [a, b] = [...pointers.values()];
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          // follow the fingers' midpoint, then scale around it
          Object.assign(zoom, { s: pinch.s, x: pinch.x + mx - pinch.mx, y: pinch.y + my - pinch.my });
          zoomTo(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist, mx, my);
        } else if (pan) {
          zoom.x = pan.x + e.clientX - pan.px;
          zoom.y = pan.y + e.clientY - pan.py;
          applyZoom();
        }
      });

      function endPointer(e) {
        const p = pointers.get(e.pointerId);
        if (!p) return;
        pointers.delete(e.pointerId);
        startGesture(); // e.g. one finger still down after a pinch keeps panning
        const isTap = e.type === "pointerup" && e.pointerType === "touch" && !pointers.size &&
          Date.now() - p.t < 300 && Math.hypot(p.x - p.sx, p.y - p.sy) < 10;
        if (!isTap) return;
        if (lastTap && Date.now() - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
          lastTap = null;
          lastTouchToggle = Date.now();
          toggleZoom(p.x, p.y);
        } else {
          lastTap = { x: p.x, y: p.y, t: Date.now() };
        }
      }
      stageImg.addEventListener("pointerup", endPointer);
      stageImg.addEventListener("pointercancel", endPointer);

      window.addEventListener("resize", () => { if (isZoomed()) applyZoom(); });

      // On phones the info panel covers half the photo, so start it closed there.
      const savedPanel = localStorage.getItem(PANEL_KEY);
      setPanelCollapsed(savedPanel === null ? window.matchMedia("(max-width: 720px)").matches : savedPanel === "1");

      // ---- Filtering: folder + free-text search + tags ----
      // Tags are keyed by their lower-cased English spelling; i18n[lang].tags
      // is index-aligned with the English list, so it supplies the label.
      function imageTags(img) {
        const en = img.tags || [];
        const tr = img.i18n && img.i18n[lang] && img.i18n[lang].tags;
        const labels = Array.isArray(tr) && tr.length === en.length ? tr : en;
        return en.map((tag, i) => ({ key: tag.trim().toLowerCase(), label: labels[i] || tag }));
      }

      function fold(s) {
        return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      }

      // English and the current language, so "fugl" and "bird" both find a bird.
      function searchText(img) {
        const tr = (img.i18n && img.i18n[lang]) || {};
        return fold([
          img.title, img.description, (img.tags || []).join(" "),
          tr.title, tr.description, (tr.tags || []).join(" "),
          img.folder, img.location && img.location.name,
        ].join(" "));
      }

      function resetFilters() {
        folderFilter.value = "";
        searchInput.value = "";
        activeTags.clear();
      }

      function renderTagFilter() {
        const s = t();
        const counts = new Map(); // key -> { count, labels: Map(label -> uses) }
        filtered.forEach((img) => {
          imageTags(img).forEach(({ key, label }) => {
            const entry = counts.get(key) || { count: 0, labels: new Map() };
            entry.count++;
            entry.labels.set(label, (entry.labels.get(label) || 0) + 1);
            counts.set(key, entry);
          });
        });
        activeTags.forEach((key) => { if (!counts.has(key)) counts.set(key, { count: 0, labels: new Map([[key, 1]]) }); });

        const all = [...counts.entries()].map(([key, { count, labels }]) => ({
          key, count,
          label: [...labels.entries()].sort((a, b) => b[1] - a[1])[0][0], // most-used spelling
        })).sort((a, b) => activeTags.has(b.key) - activeTags.has(a.key) || b.count - a.count || a.label.localeCompare(b.label));

        const shown = tagsExpanded ? all : all.filter((tag, i) => i < TAG_LIMIT || activeTags.has(tag.key));
        tagFilterEl.innerHTML = shown.map(({ key, label, count }) => {
          const on = activeTags.has(key);
          return `<button type="button" class="tag-chip" data-tag="${escapeHtml(key)}" aria-pressed="${on}">` +
            `${escapeHtml(label)}${on ? "" : ` <span class="tag-count">${count}</span>`}</button>`;
        }).join("");
        if (all.length > TAG_LIMIT) {
          const more = document.createElement("button");
          more.type = "button";
          more.className = "tag-more";
          more.textContent = tagsExpanded ? s.fewerTags : s.moreTags.replace("{n}", all.length - shown.length);
          if (tagsExpanded || all.length > shown.length) tagFilterEl.appendChild(more);
        }
      }

      function applyFilter() {
        const folder = folderFilter.value;
        const words = fold(searchInput.value).split(/\s+/).filter(Boolean);
        filtered = images.filter((img) => {
          if (folder && img.folder !== folder) return false;
          if (activeTags.size) {
            const keys = new Set(imageTags(img).map((tag) => tag.key));
            for (const key of activeTags) if (!keys.has(key)) return false;
          }
          if (words.length) {
            const text = searchText(img);
            if (!words.every((w) => text.includes(w))) return false;
          }
          return true;
        });
        clearFiltersBtn.hidden = !(folder || words.length || activeTags.size);
        renderTagFilter();
        renderGrid();
      }

      function toggleTag(key) {
        if (activeTags.has(key)) activeTags.delete(key);
        else activeTags.add(key);
        applyFilter();
      }

      folderFilter.addEventListener("change", () => {
        closeLightbox();
        applyFilter();
      });

      searchInput.addEventListener("input", applyFilter);

      clearFiltersBtn.addEventListener("click", () => {
        resetFilters();
        applyFilter();
      });

      tagFilterEl.addEventListener("click", (e) => {
        if (e.target.closest(".tag-more")) {
          tagsExpanded = !tagsExpanded;
          renderTagFilter();
          return;
        }
        const chip = e.target.closest(".tag-chip");
        if (chip) toggleTag(chip.dataset.tag);
      });

      // Clicking a tag in the info panel shows every photo with that tag.
      document.getElementById("panel-tags").addEventListener("click", (e) => {
        const btn = e.target.closest(".tag[data-tag]");
        if (!btn) return;
        closeLightbox();
        resetFilters();
        activeTags.add(btn.dataset.tag);
        applyFilter();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      lang = detectLang();
      applyStaticStrings();

      fetch("image_info.json")
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((data) => {
          images = (data.images || []).slice().sort((a, b) => (a.added_at || "").localeCompare(b.added_at || ""));
          const folders = Array.from(new Set(images.map((i) => i.folder).filter(Boolean))).sort();
          folderFilter.innerHTML = `<option value="" id="folder-default-option">${t().allFolders}</option>` +
            folders.map((f) => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join("");
          applyFilter();
          const sharedId = photoIdFromHash();
          if (sharedId) openPhotoById(sharedId);
        })
        .catch((err) => {
          loadFailed = true;
          lastErrorMessage = err.message;
          emptyState.textContent = t().loadError + lastErrorMessage;
          emptyState.style.display = "";
        });
    })();
  </script>
</body>
</html>
